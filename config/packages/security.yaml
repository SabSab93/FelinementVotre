security:
    password_hashers:
        App\Entity\Users:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # # Firewall public pour les pages accessibles sans authentification
        # public:
        #     pattern: ^/(login|register)
        #     security: false

        # Firewall principal pour le reste du site
        main:
            pattern: ^/
            custom_authenticator: App\Security\AppCustomAuthenticator
            logout:
                path: app_logout
                target: /login
            provider: app_user_provider
            stateless: false

    access_control:
        # Routes protégées nécessitant une authentification
        - { path: ^/felinementvotre, roles: ROLE_USER }
        - { path: ^/cats, roles: ROLE_USER }
        # Les routes /login et /register sont gérées par le firewall public, donc accessibles anonymement










